services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_auth
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: meshly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://meshly:meshly_dev_password@postgres:5432/meshly_auth?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3007
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: meshly_products
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/meshly_products | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./services/product-service
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/meshly_products
      JWT_ACCESS_SECRET: change-me-access-secret
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3002:3002"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    build: ./services/cart-service
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://redis:6379
      CART_TTL_SECONDS: 604800
      JWT_ACCESS_SECRET: change-me-access-secret
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"

  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_orders
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: meshly_order_password
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: meshly
      RABBITMQ_DEFAULT_PASS: meshly_rabbit_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://meshly:meshly_order_password@order-postgres:5432/meshly_orders?schema=public
      PRODUCT_SERVICE_URL: http://product-service:3002
      RABBITMQ_URL: amqp://meshly:meshly_rabbit_password@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      JWT_ACCESS_SECRET: change-me-access-secret
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3004:3004"

  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_payments
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: meshly_payment_password
    ports:
      - "5434:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./services/payment-service
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://meshly:meshly_payment_password@payment-postgres:5432/meshly_payments?schema=public
      RABBITMQ_URL: amqp://meshly:meshly_rabbit_password@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      PAYMENT_QUEUE: payment-service.order-placed
      MOCK_PAYMENT_FAILURE_RATE: 0
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3005:3005"

  notification-service:
    build: ./services/notification-service
    environment:
      NODE_ENV: production
      PORT: 3006
      RABBITMQ_URL: amqp://meshly:meshly_rabbit_password@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      NOTIFICATION_QUEUE: notification-service.events
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3006:3006"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - api-gateway
    ports:
      - "3007:3000"

  api-gateway:
    build: ./api-gateway
    environment:
      CORS_ORIGIN: http://localhost:3007
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      JWT_ACCESS_SECRET: change-me-access-secret
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      - auth-service
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  order-postgres-data:
  rabbitmq-data:
  payment-postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_auth
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: meshly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://meshly:meshly_dev_password@postgres:5432/meshly_auth?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: meshly_products
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/meshly_products | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./services/product-service
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/meshly_products
      JWT_ACCESS_SECRET: change-me-access-secret
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3002:3002"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    build: ./services/cart-service
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://redis:6379
      CART_TTL_SECONDS: 604800
      JWT_ACCESS_SECRET: change-me-access-secret
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"

  api-gateway:
    build: ./api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      JWT_ACCESS_SECRET: change-me-access-secret
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      - auth-service
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  mongo-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_auth
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://meshly:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}@postgres:5432/meshly_auth?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3007
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: meshly_products
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/meshly_products | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./services/product-service
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/meshly_products
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3002:3002"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cart-service:
    build: ./services/cart-service
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://redis:6379
      CART_TTL_SECONDS: 604800
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3003:3003"

  order-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_orders
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
    ports:
      - "5435:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: meshly
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://meshly:${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}@order-postgres:5432/meshly_orders?schema=public
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3005
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      RABBITMQ_URL: amqp://meshly:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      ORDER_PAYMENT_QUEUE: order-service.payment-events
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      CORS_ORIGIN: http://localhost:3007
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3004:3004"

  payment-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meshly_payments
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./services/payment-service
    env_file:
      - ./services/payment-service/.env
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://meshly:${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}@payment-postgres:5432/meshly_payments?schema=public
      RABBITMQ_URL: amqp://meshly:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      PAYMENT_QUEUE: payment-service.order-placed
      STRIPE_CURRENCY: usd
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      FRONTEND_URL: http://localhost:3007
      CLUB_SUCCESS_URL: http://localhost:3007/club/success
      CLUB_CANCEL_URL: http://localhost:3007/club/cancelled
      CLUB_PORTAL_RETURN_URL: http://localhost:3007/account
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3005:3005"

  notification-service:
    build: ./services/notification-service
    environment:
      NODE_ENV: production
      PORT: 3006
      RABBITMQ_URL: amqp://meshly:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672
      RABBITMQ_EXCHANGE: meshly.events
      NOTIFICATION_QUEUE: notification-service.events
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "3006:3006"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}
    depends_on:
      - api-gateway
    ports:
      - "3007:3000"

  api-gateway:
    build: ./api-gateway
    environment:
      CORS_ORIGIN: http://localhost:3007
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      - auth-service
      - payment-service
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  order-postgres-data:
  rabbitmq-data:
  payment-postgres-data:

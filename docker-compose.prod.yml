name: meshly-prod

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [meshly]

services:
  nginx:
    image: nginx:1.27.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt-data:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - api-gateway
      - payment-service
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    networks: [meshly]

  # Standalone issuance is deliberately profile-gated: on a single-domain VPS it
  # avoids a permanently running Certbot sidecar and keeps certificate ownership simple.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: [certificate]
    ports:
      - "80:80"
    volumes:
      - letsencrypt-data:/etc/letsencrypt
    mem_limit: 64m
    networks: [meshly]

  auth-postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meshly_auth
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env.prod}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_auth"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 160m
    networks: [meshly]

  mongodb:
    image: mongo:8.0.3
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: meshly_products
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok", "mongodb://localhost:27017/meshly_products"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks: [meshly]

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
    mem_limit: 64m
    networks: [meshly]

  order-postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meshly_orders
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env.prod}
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_orders"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 160m
    networks: [meshly]

  payment-postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meshly_payments
      POSTGRES_USER: meshly
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env.prod}
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshly -d meshly_payments"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 160m
    networks: [meshly]

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-meshly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.prod}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    networks: [meshly]

  auth-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env.prod}/meshly-auth-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://meshly:${AUTH_DB_PASSWORD}@auth-postgres:5432/meshly_auth?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.prod}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.prod}
      COOKIE_SECURE: "true"
    depends_on:
      auth-postgres:
        condition: service_healthy
    mem_limit: 128m

  product-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-product-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://mongodb:27017/meshly_products
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 160m

  cart-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-cart-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CART_TTL_SECONDS: ${CART_TTL_SECONDS:-604800}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 96m

  order-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-order-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://meshly:${ORDER_DB_PASSWORD}@order-postgres:5432/meshly_orders?schema=public
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3005
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env.prod}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meshly}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-meshly.events}
      ORDER_PAYMENT_QUEUE: ${ORDER_PAYMENT_QUEUE:-order-service.payment-events}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
    mem_limit: 160m

  payment-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-payment-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://meshly:${PAYMENT_DB_PASSWORD}@payment-postgres:5432/meshly_payments?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meshly}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-meshly.events}
      PAYMENT_QUEUE: ${PAYMENT_QUEUE:-payment-service.order-placed}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env.prod}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env.prod}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      CLUB_SUCCESS_URL: ${PUBLIC_ORIGIN}/club/success
      CLUB_CANCEL_URL: ${PUBLIC_ORIGIN}/club/cancelled
      CLUB_PORTAL_RETURN_URL: ${PUBLIC_ORIGIN}/account
    depends_on:
      payment-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 192m

  notification-service:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-notification-service:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3006
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-meshly}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-meshly.events}
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification-service.events}
    depends_on:
      rabbitmq:
        condition: service_healthy
    mem_limit: 96m

  api-gateway:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-api-gateway:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service
      - payment-service
    mem_limit: 128m

  frontend:
    <<: *service-defaults
    image: docker.io/${DOCKERHUB_USERNAME}/meshly-frontend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api-gateway
    mem_limit: 256m

networks:
  meshly:
    driver: bridge

volumes:
  auth-postgres-data:
  mongo-data:
  redis-data:
  order-postgres-data:
  payment-postgres-data:
  rabbitmq-data:
  letsencrypt-data:
